<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2740" />
      <stop offset="0.55" stop-color="#111827" />
      <stop offset="1" stop-color="#0a0f1a" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.32" />
      <stop offset="0.62" stop-color="#4f7dff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- macOS-style rounded square with the standard transparent margin. -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#bg)" />
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#glow)" />
  <rect
