appId: dev.basecase.app
productName: Base Case
copyright: Copyright (c) 2026 Base Case contributors

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

extraResources:
  - from: ../../content
    to: content
  - from: ../../build
    to: judge
    filter:
      - judge
      - judge.exe
  - from: ../../build/runtime
    to: runtimes

artifactName: Base-Case-${version}-${arch}.${ext}

afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null

win:
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
