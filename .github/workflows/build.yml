name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package (macOS, unsigned)
        if: runner.os == 'macOS'
        run: pnpm package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package (Windows, unsigned)
        if: runner.os == 'Windows'
        run: pnpm package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify macOS bundle signatures
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "apps/desktop/dist/mac/Base Case.app"
          codesign --verify --deep --strict "apps/desktop/dist/mac-arm64/Base Case.app"

      - name: Generate checksums
        run: node scripts/checksums.mjs apps/desktop/dist

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: base-case-${{ runner.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release/ \;

      - name: Generate combined checksums
        run: node scripts/checksums.mjs release

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Base Case $GITHUB_REF_NAME" --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
