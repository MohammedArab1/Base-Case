name: Judge conformance

on:
  push:
    branches: [main]
    paths:
      - 'services/judge/**'
      - '.github/workflows/judge.yml'
  pull_request:
    paths:
      - 'services/judge/**'
      - '.github/workflows/judge.yml'

concurrency:
  group: judge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Judge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: services/judge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Doctor
        run: go run ./cmd/judge doctor

      - name: Vet
        run: go vet ./...

      - name: Unit and protocol tests
        shell: bash
        run: go test -json ./... | node ../../scripts/annotate-go-tests.mjs
