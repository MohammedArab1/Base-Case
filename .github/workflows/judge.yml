name: Judge conformance

on:
  push:
    branches: [main]
    paths:
      - 'services/judge/**'
      - '.github/workflows/judge.yml'
  pull_request:
    paths:
      - 'services/judge/**'
      - '.github/workflows/judge.yml'

concurrency:
  group: judge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Judge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: services/judge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Unit and protocol tests
        run: go test ./...

      - name: Doctor
        run: go run ./cmd/judge doctor
