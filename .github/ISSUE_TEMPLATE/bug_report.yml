name: Bug report
description: Report a defect in the app, judge, content, or docs.
title: '[Bug]: '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include API keys, tokens, personal file
        paths, or hidden test contents. For security issues, follow `SECURITY.md`
        instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior and why it is wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App shell / UI
        - Coding workspace
        - System design workspace
        - Judge / runtimes
        - Content pack
        - AI provider
        - Data / backup / export
        - Documentation
        - Build / packaging
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: App version or commit SHA.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach a redacted diagnostics export if available.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and personal paths from this report.
          required: true
