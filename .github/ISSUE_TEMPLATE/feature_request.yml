name: Feature request
description: Suggest a product or engineering improvement.
title: '[Feature]: '
labels: ['type:feature']
body:
  - type: markdown
    attributes:
      value: |
        Keep the MVP scope in mind: offline-first, local-first, no accounts, no
        social features, no full IDE. See `PLAN.md` Sections 1.5–1.6.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: phase
    attributes:
      label: Suggested phase
      options:
        - Phase 2 — App foundation
        - Phase 3 — Judge engine
        - Phase 4 — Coding practice
        - Phase 5 — System design
        - Phase 6 — AI tutor
        - Phase 7 — Content
        - Phase 8+ — Release / post-MVP
        - Not sure
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This works offline or has a clear offline fallback.
          required: true
        - label: This does not require accounts, cloud sync, or telemetry.
          required: true
